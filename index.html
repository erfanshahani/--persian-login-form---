<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم شیک ورود و ثبت‌نام</title>
    <link rel="stylesheet" href="style.css">
<body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>ایجاد حساب کاربری</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-google"></i></a>
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-github"></i></a>
                </div>
                <span>یا از ایمیل برای ثبت‌نام استفاده کنید</span>
                <input type="text" placeholder="نام و نام خانوادگی" required />
                <input type="email" placeholder="ایمیل" required />
                <input type="password" placeholder="گذرواژه" required />
                <button>ثبت‌نام</button>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form action="#">
                <h1>ورود به حساب</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-google"></i></a>
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-github"></i></a>
                </div>
                <span>یا از حساب کاربری خود استفاده کنید</span>
                <input type="email" placeholder="ایمیل" required />
                <input type="password" placeholder="گذرواژه" required />
                <a href="#">فراموشی گذرواژه؟</a>
                <button>ورود</button>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>خوش برگشتید!</h1>
                    <p>برای حفظ ارتباط، با اطلاعات شخصی خود وارد شوید.</p>
                    <button class="ghost" id="signIn">ورود</button>
                </div>
                
                <div class="overlay-panel overlay-right">
                    <h1>سلام دوست عزیز!</h1>
                    <p>با وارد کردن جزئیات خود، سفر را با ما شروع کنید.</p>
                    <button class="ghost" id="signUp">ثبت‌نام</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
